# phishtriage scoring rules
#
# Every rule has:
#   id           stable identifier, shown in the report
#   description  one line, what fired
#   category     authentication | alignment | sender | links | attachments | content | hops | enrichment
#   weight       points added when the rule fires (final score is capped at 100)
#   rationale    one sentence on why an analyst cares
#   when         the condition (see below)
#   supersedes   optional list of rule ids that are dropped when this rule fires
#
# Conditions are data. Supported forms:
#   {field: auth.dmarc.status, in: [fail]}          dotted path into the result, with one of:
#                                                    equals / in / not_in / is_true / is_false /
#                                                    is_none / not_empty / gte / lte / contains
#   {flag: lookalike_domain}                         any URL, domain, IP or attachment carries the flag
#   {flag: macro_enabled, scope: attachments}           restrict to urls | domains | ips | attachments
#   {enrichment: {source: virustotal, status: malicious, data_gte: {malicious: 3}}}
#   {enrichment: {source: urlhaus, unless_flag: shared_hosting}}  ignore results on indicators
#                                                    carrying the flag (e.g. a shared host's
#                                                    reputation says nothing about this email)
#   {keywords: true}                                 one or more keyword categories matched
#   {all: [...]}, {any: [...]}, {not: {...}}         composition
#
# A rule may also set `weight_per: keyword_category` and `max_weight: N` to
# score 'weight' once per matched keyword category, capped at N.

verdicts:
  # lower bound of each band, inclusive
  CLEAN: 0
  SUSPICIOUS: 20
  LIKELY PHISH: 50
  MALICIOUS: 80

rules:
  # ------------------------------------------------------------------ authentication
  - id: dmarc_fail
    description: DMARC check failed
    category: authentication
    weight: 25
    rationale: The domain owner published a policy and this message failed it, which is the strongest single header-based spoofing signal available.
    when: {field: auth.dmarc.status, in: [fail, permerror]}

  - id: dmarc_none
    description: No DMARC result for the sender domain
    category: authentication
    weight: 5
    rationale: Without a DMARC policy the From domain can be spoofed freely, so every other check has to carry more weight.
    when: {field: auth.dmarc.status, in: [none]}

  - id: spf_fail
    description: SPF failed or soft-failed
    category: authentication
    weight: 15
    rationale: The sending server is not one the envelope domain authorised, which is what you see when someone else's server sends as that domain.
    when: {field: auth.spf.status, in: [fail, softfail, permerror]}

  - id: dkim_fail_or_none
    description: DKIM failed or is absent
    category: authentication
    weight: 10
    rationale: An unsigned or broken signature means the message body and key headers could have been altered or forged in transit.
    when: {field: auth.dkim.status, in: [fail, none, missing, permerror]}

  - id: no_auth_headers
    description: No authentication results recorded at all
    category: authentication
    weight: 10
    rationale: Mail that never passed through an authenticating gateway (or had those headers stripped) cannot be trusted on its headers alone.
    when: {field: auth.no_auth_headers, is_true: true}

  - id: live_spf_unauthorized
    description: Live SPF lookup says the origin IP is not authorised
    category: authentication
    weight: 15
    rationale: Independently re-checking SPF catches cases where the receiving server's result is missing or was forged in a relayed header.
    when: {field: auth.live_dns_spf_authorized, is_false: true}

  # ------------------------------------------------------------------ alignment
  - id: spf_misaligned
    description: Return-Path domain does not align with From domain
    category: alignment
    weight: 15
    rationale: An SPF pass for a domain the user never sees is exactly how bulk phishing kits get a green check while displaying a spoofed From; scored only when DMARC did not pass, because DMARC passing means the other mechanism aligned.
    when:
      all:
        - {field: auth.spf_aligned, is_false: true}
        - {field: auth.dmarc.status, not_in: [pass]}

  - id: dkim_misaligned
    description: DKIM signing domain does not align with From domain
    category: alignment
    weight: 10
    rationale: A valid signature from an unrelated domain proves nothing about the displayed sender; it is the classic "authenticated but not aligned" trick. Scored only when DMARC did not pass, since Microsoft 365 tenants routinely sign with onmicrosoft.com while SPF aligns.
    when:
      all:
        - {field: auth.dkim_aligned, is_false: true}
        - {field: auth.dmarc.status, not_in: [pass]}

  - id: reply_to_mismatch
    description: Reply-To points to a different domain than From
    category: sender
    weight: 15
    rationale: Replies are silently redirected to the attacker, which is the mechanism behind most CEO-fraud and invoice-redirect scams.
    when: {field: auth.reply_to_mismatch, is_true: true}

  - id: display_name_spoof
    description: Display name impersonates a brand or embeds a different address
    category: sender
    weight: 20
    rationale: Mobile clients show only the display name, so "Microsoft Support <random@freemail>" looks legitimate to most recipients.
    when: {field: auth.display_name_spoof, is_true: true}

  # ------------------------------------------------------------------ links
  - id: link_text_mismatch
    description: Visible link text points somewhere other than its href
    category: links
    weight: 20
    rationale: Showing one URL and linking another has no legitimate purpose in a plain notification and is the signature of credential-harvest lures.
    when: {flag: link_text_mismatch, scope: urls}

  - id: lookalike_domain
    description: Domain imitates a known brand
    category: links
    weight: 25
    rationale: Typosquats and brand-plus-word domains exist to be mistaken for the real thing; legitimate senders use their own domain.
    when: {flag: lookalike_domain}

  - id: raw_ip_url
    description: URL uses a bare IP address instead of a hostname
    category: links
    weight: 15
    rationale: Legitimate services almost never link to raw IPs; attackers do because throwaway hosts have no DNS.
    when: {flag: raw_ip_url, scope: urls}

  - id: url_shortener
    description: Link goes through a URL shortener
    category: links
    weight: 5
    rationale: Shorteners hide the destination from both the user and URL reputation checks.
    when: {flag: shortener, scope: urls}

  - id: punycode_domain
    description: Internationalised (punycode) domain
    category: links
    weight: 15
    rationale: IDN homograph domains render as a familiar brand while resolving somewhere else entirely.
    when: {flag: punycode}

  - id: credentials_in_url
    description: URL contains userinfo before an @ sign
    category: links
    weight: 15
    rationale: A link such as https://paypal.com@evil.example displays a trusted name, but the browser connects to the host after the @.
    when: {flag: credentials_in_url, scope: urls}

  - id: subdomain_depth
    description: Excessively deep subdomain
    category: links
    weight: 5
    rationale: Long subdomain chains are used to push the real domain off the edge of a mobile address bar.
    when: {flag: subdomain_depth}

  - id: file_hosting_link
    description: Link to a file-hosting or form service
    category: links
    weight: 5
    rationale: Free hosting and form builders are a cheap way to serve a phishing page from a reputable domain; weak on its own, meaningful with other signals.
    when: {flag: file_hosting, scope: urls}

  # ------------------------------------------------------------------ attachments
  - id: double_extension
    description: Attachment has a misleading double extension
    category: attachments
    weight: 30
    rationale: A name like invoice.pdf.exe only exists to fool a user whose client hides the real extension.
    when: {flag: double_extension, scope: attachments}

  - id: mime_mismatch
    description: Attachment content does not match its extension
    category: attachments
    weight: 30
    rationale: A file whose bytes say "executable" while its name says "PDF" is disguised on purpose.
    when: {flag: mime_mismatch, scope: attachments}

  - id: executable_attachment
    description: Directly executable attachment
    category: attachments
    weight: 30
    rationale: No business process emails .exe/.scr/.js files; every mail gateway blocks them for a reason.
    when: {flag: executable, scope: attachments}

  - id: macro_attachment
    description: Macro-enabled Office attachment
    category: attachments
    weight: 20
    rationale: VBA macros remain a top initial-access technique; unexpected .docm/.xlsm files should be treated as payload delivery.
    when: {flag: macro_enabled, scope: attachments}

  - id: container_attachment
    description: Disk image, shortcut, or HTML attachment
    category: attachments
    weight: 25
    rationale: .iso/.img/.lnk/.html attachments bypass mark-of-the-web and macro blocking and became the default loader wrapper after Office hardened macros.
    when: {flag: dangerous_container, scope: attachments}

  - id: encrypted_archive
    description: Password-protected archive
    category: attachments
    weight: 20
    rationale: Encrypting the archive defeats gateway scanning; the password is in the email body so only the user can open it.
    when: {flag: password_protected_archive, scope: attachments}

  - id: archive_with_executable
    description: Archive contains an executable or script
    category: attachments
    weight: 25
    rationale: Wrapping a payload in a ZIP is the simplest way to get an executable past an attachment filter.
    when: {flag: archive_contains_executable, scope: attachments}

  # ------------------------------------------------------------------ content
  - id: lure_keywords
    description: Urgency, credential, financial, threat or reward language
    category: content
    weight: 5
    weight_per: keyword_category
    max_weight: 15
    rationale: Social-engineering lures lean on pressure and fear; the language alone is weak evidence but it compounds with everything else.
    when: {keywords: true}

  # ------------------------------------------------------------------ hops
  - id: hop_timestamp_anomaly
    description: Received timestamps go backwards or jump more than 24h
    category: hops
    weight: 10
    rationale: Forged or replayed Received headers rarely have consistent clocks; real relays hand off within seconds.
    when: {field: hops.timestamp_anomaly, is_true: true}

  - id: private_ip_origin
    description: Private or reserved IP presented as the external origin
    category: hops
    weight: 10
    rationale: A message that arrives at the boundary MX "from 192.168.x.x" was either injected internally or had its headers forged.
    when: {field: hops.private_ip_origin, is_true: true}

  - id: reverse_dns_mismatch
    description: Relay hostname does not match its reverse DNS
    category: hops
    weight: 10
    rationale: A server claiming to be mail.bank.example whose PTR says cheap-vps is lying about who it is.
    when: {field: hops.reverse_dns_mismatch, is_true: true}

  # ------------------------------------------------------------------ enrichment
  - id: urlhaus_hit
    description: URL or host is listed on URLhaus
    category: enrichment
    weight: 40
    rationale: URLhaus is a curated feed of active malware distribution URLs; a hit means someone already confirmed it is bad. Host-level hits on shared platforms (storage.googleapis.com etc.) are ignored; the specific URL still counts.
    when: {enrichment: {source: urlhaus, status: malicious, unless_flag: shared_hosting}}

  - id: vt_malicious
    description: Three or more VirusTotal vendors flag it malicious
    category: enrichment
    weight: 40
    rationale: Multi-vendor agreement on VirusTotal is about as close to ground truth as a free lookup gets.
    supersedes: [vt_suspicious]
    when: {enrichment: {source: virustotal, data_gte: {malicious: 3}, unless_flag: shared_hosting}}

  - id: vt_suspicious
    description: One or two VirusTotal vendors flag it malicious or suspicious
    category: enrichment
    weight: 15
    rationale: One or two detections are often early signal on a fresh campaign, worth a closer look but not conclusive.
    when: {enrichment: {source: virustotal, status: [malicious, suspicious], unless_flag: shared_hosting}}

  - id: domain_age_7d
    description: Domain registered less than 7 days ago
    category: enrichment
    weight: 30
    rationale: Phishing domains are usually registered days before the campaign; a week-old domain emailing you a login link is not a coincidence.
    supersedes: [domain_age_30d]
    when: {enrichment: {source: rdap, data_lt: {age_days: 7}}}

  - id: domain_age_30d
    description: Domain registered less than 30 days ago
    category: enrichment
    weight: 20
    rationale: Established organisations do not send from month-old domains; new registrations are cheap and disposable.
    when: {enrichment: {source: rdap, data_lt: {age_days: 30}}}
